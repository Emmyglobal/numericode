<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>NumeryCode — Mathematics &amp; Code, Taught Live</title>
    <meta
      name="description"
      content="Learn Mathematics, Programming and practical technology skills with NumeryCode — structured online courses, live classes and flexible self-paced study, guided by registered trainers. Free for learners."
    />
    <meta
      name="keywords"
      content="mathematics, programming, online school, live classes, self-paced courses, coding for kids, parents, trainers, EdTech, Nigeria"
    />
    <meta name="author" content="Nwafor Ugochukwu Emmanuel" />
    <meta name="theme-color" content="#1E3A5F" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://numerycode.com/" />

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "NumeryCode",
      "url": "https://numerycode.com/",
      "logo": "https://numerycode.com/favicon.svg",
      "description": "NumeryCode is an online learning platform for Mathematics, Programming and technology, connecting learners with structured courses and registered trainers."
    }
    </script>

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="NumeryCode — Mathematics &amp; Code, Taught Live"
    />
    <meta
      property="og:description"
      content="Learn Mathematics, Programming and technology skills — live classes, self-paced courses and registered trainers on NumeryCode."
    />
    <meta property="og:site_name" content="NumeryCode" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="NumeryCode — Mathematics &amp; Code, Taught Live"
    />
    <meta
      name="twitter:description"
      content="Learn Mathematics, Programming and technology skills — live classes, self-paced courses and registered trainers on NumeryCode."
    />

    <!-- Google AdSense -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8061135224509487"
      crossorigin="anonymous"
    ></script>

    <!-- Performance: preconnect to Google Fonts CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: Inter + Fira Code -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap"
      />
    </noscript>

    <!-- Dark mode flash prevention -->
    <script>
      try {
        var s = localStorage.getItem('numerycode-ui');
        if (s && JSON.parse(s).state && JSON.parse(s).state.theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
